# ═══════════════════════════════════════════════════════════
#  JuriBook - Docker Compose (environnement local)
#  Lance : Kafka (KRaft), provisioning des topics, MailHog, 4 bases
#  PostgreSQL, services
#  KRaft = Kafka sans Zookeeper (natif depuis Kafka 3.3+)
#
#  Prérequis : copier docker/env/.env.example en docker/env/.env
#
#  Usage (depuis juribook-docker/docker/) :
#    docker compose up -d                         → tout démarrer
#    docker compose up -d postgres-auth kafka     → infra seule
#    docker compose logs -f auth-service          → logs d'un service
#    docker compose logs kafka-init                → voir le provisioning des topics
#    docker compose down -v                       → tout supprimer
#
#  MailHog : UI web sur http://localhost:8025 pour voir
#  les emails envoyés par notification-service sans vrai provider SMTP.
# ═══════════════════════════════════════════════════════════

services:

  # ─────────────────────────────────────────────
  #  Kafka en mode KRaft (sans Zookeeper)
  #  PLAINTEXT      → inter-conteneurs  (29092)
  #  PLAINTEXT_HOST → accès hôte        (9092)
  #  CONTROLLER     → coordination KRaft (9093, interne)
  #
  #  KAFKA_AUTO_CREATE_TOPICS_ENABLE passé à "false".
  #  Les 8 topics de la plateforme sont désormais provisionnés
  #  explicitement par le service kafka-init (partitions + rétention
  #  contrôlées), plus question de laisser un service créer un topic
  #  par erreur avec les valeurs par défaut (1 partition, rétention
  #  standard) au premier message publié.
  # ─────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: juribook-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Identifiant unique du cluster KRaft (généré une fois, fixe)
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qg
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - juribook-network

  # ─────────────────────────────────────────────
  #  Provisioning des 8 topics Kafka
  #  Conteneur "one-shot" : tourne une fois, crée les topics
  #  (partitions + rétention, cf. create-topics.sh), puis s'arrête.
  #  Les services qui publient/consomment dépendent de sa complétion
  #  réussie (condition: service_completed_successfully) plutôt que
  #  juste de kafka étant healthy, pour éviter une race condition où
  #  un producer démarre avant que son topic n'existe.
  # ─────────────────────────────────────────────
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: juribook-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./kafka-init/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["sh", "/create-topics.sh"]
    networks:
      - juribook-network
    restart: "no"

  # ─────────────────────────────────────────────
  #  MailHog
  #  Serveur SMTP factice pour tester l'envoi d'emails sans vrai
  #  provider. notification-service pointe dessus par défaut
  #  (MAIL_HOST=mailhog, port 1025). UI web pour consulter les emails
  #  reçus : http://localhost:8025
  # ─────────────────────────────────────────────
  mailhog:
    image: mailhog/mailhog
    container_name: juribook-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # UI web
    networks:
      - juribook-network

  # ─────────────────────────────────────────────
  #  PostgreSQL - une base par service
  #  Ports hôte :
  #    auth     → localhost:5432
  #    lawyer   → localhost:5433
  #    booking  → localhost:5434
  #    notification → localhost:5435
  # ─────────────────────────────────────────────
  postgres-auth:
    image: postgres:16-alpine
    container_name: juribook-postgres-auth
    restart: unless-stopped
    env_file:
      - env/.env
    environment:
      POSTGRES_DB: authdb
    ports:
      - "5432:5432"
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data
      - ./init-scripts/init-authdb.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-juribook} -d authdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - juribook-network

  postgres-lawyer:
    image: postgres:16-alpine
    container_name: juribook-postgres-lawyer
    restart: unless-stopped
    env_file:
      - env/.env
    environment:
      POSTGRES_DB: lawyerdb
    ports:
      - "5433:5432"
    volumes:
      - postgres-lawyer-data:/var/lib/postgresql/data
      - ./init-scripts/init-lawyerdb.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-juribook} -d lawyerdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - juribook-network

  postgres-booking:
    image: postgres:16-alpine
    container_name: juribook-postgres-booking
    restart: unless-stopped
    env_file:
      - env/.env
    environment:
      POSTGRES_DB: bookingdb
    ports:
      - "5434:5432"
    volumes:
      - postgres-booking-data:/var/lib/postgresql/data
      - ./init-scripts/init-bookingdb.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-juribook} -d bookingdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - juribook-network

  postgres-notification:
    image: postgres:16-alpine
    container_name: juribook-postgres-notification
    restart: unless-stopped
    env_file:
      - env/.env
    environment:
      POSTGRES_DB: notificationdb
    ports:
      - "5435:5432"
    volumes:
      - postgres-notification-data:/var/lib/postgresql/data
      - ./init-scripts/init-notificationdb.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-juribook} -d notificationdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - juribook-network

  # Sprint 5.7
  postgres-audit:
    image: postgres:16-alpine
    container_name: juribook-postgres-audit
    restart: unless-stopped
    env_file:
      - env/.env
    environment:
      POSTGRES_DB: auditdb
    ports:
      - "5436:5432"
    volumes:
      - postgres-audit-data:/var/lib/postgresql/data
      - ./init-scripts/init-auditdb.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-juribook} -d auditdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - juribook-network

  # ─────────────────────────────────────────────
  #  Microservices
  #  context: ../<service> → au même niveau que juribook-docker/
  # ─────────────────────────────────────────────
  # Auth - Authentification et gestion des comptes
  auth-service:
    build:
      context: ../../juribook-auth-service
      dockerfile: Dockerfile
    container_name: juribook-auth
    restart: unless-stopped
    depends_on:
      postgres-auth:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "8081:8081"
    env_file:
      - env/.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-auth:5432/authdb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-juribook}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-juribook}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - juribook-network

  # Lawyer - Profils avocats, leurs avis, leurs spécialités, leurs disponibilités
  lawyer-service:
    build:
      context: ../../juribook-lawyer-service
      dockerfile: Dockerfile
    container_name: juribook-lawyer
    restart: unless-stopped
    depends_on:
      postgres-lawyer:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      auth-service:
        condition: service_healthy
    ports:
      - "8082:8082"
    env_file:
      - env/.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-lawyer:5432/lawyerdb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-juribook}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-juribook}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8082/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - juribook-network

  # Booking - Disponibilités (Availability), créneaux (TimeSlot), réservations
  booking-service:
    build:
      context: ../../juribook-booking-service
      dockerfile: Dockerfile
    container_name: juribook-booking
    restart: unless-stopped
    depends_on:
      postgres-booking:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      lawyer-service:
        condition: service_healthy
    ports:
      - "8083:8083"
    env_file:
      - env/.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-booking:5432/bookingdb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-juribook}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-juribook}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - juribook-network

  # Notification - Email, SMS, push notification (via Kafka)
  notification-service:
    build:
      context: ../../juribook-notification-service
      dockerfile: Dockerfile
    container_name: juribook-notification
    restart: unless-stopped
    depends_on:
      postgres-notification:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      mailhog:
        condition: service_started
      auth-service:
        condition: service_healthy
      lawyer-service:
        condition: service_healthy
      booking-service:
        condition: service_healthy
    ports:
      - "8084:8084"
    env_file:
      - env/.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-notification:5432/notificationdb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-juribook}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-juribook}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      BOOKING_SERVICE_BASE_URL: http://booking-service:8083
      LAWYER_SERVICE_BASE_URL: http://lawyer-service:8082
      AUTH_SERVICE_BASE_URL: http://auth-service:8081
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8084/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - juribook-network

  # Audit - journal d'audit immutable, consomme tous les topics (Sprint 5.7)
  audit-service:
    build:
      context: ../../juribook-audit-service
      dockerfile: Dockerfile
    container_name: juribook-audit
    restart: unless-stopped
    depends_on:
      postgres-audit:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "8085:8085"
    env_file:
      - env/.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-audit:5432/auditdb
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-juribook}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-juribook}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8085/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - juribook-network

# ─────────────────────────────────────────────
#  Volumes persistants
# ─────────────────────────────────────────────
volumes:
  kafka-data:
  postgres-auth-data:
  postgres-lawyer-data:
  postgres-booking-data:
  postgres-notification-data:
  postgres-audit-data:

# ─────────────────────────────────────────────
#  Réseau interne
# ─────────────────────────────────────────────
networks:
  juribook-network:
    driver: bridge